name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mambasplit
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mambasplit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U mambasplit -d mambasplit_test
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MambaSplit.Api.sln

      - name: Build
        run: dotnet build MambaSplit.Api.sln --configuration Release --no-restore

      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do pg_isready -h 127.0.0.1 -p 5432 -U mambasplit && echo 'Postgres ready' && exit 0 || sleep 1; done
          echo 'Postgres did not become ready' && exit 1

      - name: Test
        env:
          ASPNETCORE_ENVIRONMENT: Test
          APP__SECURITY__JWT__SECRET: ${{ vars.TEST_JWT_SECRET }}
          CONNECTIONSTRINGS__DEFAULT: "Host=127.0.0.1;Port=5432;Database=mambasplit_test;Username=mambasplit;Password=password;"
        run: dotnet test MambaSplit.Api.sln --configuration Release --no-build --nologo
